<div class="modal-backdrop" id="start-session-modal" aria-hidden="true" role="dialog" aria-modal="true">
  <div class="modal-card modal-md">
    <div class="modal-header">
      <h3 class="modal-title"><i data-lucide="camera" style="color:var(--primary);"></i> Start Attendance Session</h3>
      <button type="button" class="btn btn-outline btn-sm modal-close-btn" data-close-modal aria-label="Close modal">
        <i data-lucide="x"></i>
      </button>
    </div>
    <form method="post" id="start-session-form" action="">
      {% csrf_token %}
      <div class="modal-body" style="padding:24px;">
        <div style="background:var(--bg-secondary); border:1px solid var(--border); border-radius:10px; padding:16px; margin-bottom:16px;">
          <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:12px; gap:8px;">
            <div>
              <span class="text-muted" style="font-size:11px; text-transform:uppercase; letter-spacing:.5px; font-weight:700;">Class Section</span>
              <h4 id="start-modal-section-name" style="margin:2px 0 0; font-size:17px; font-weight:700; color:var(--text-primary);">—</h4>
            </div>
            <span class="badge badge-accent" id="start-modal-subject-code" style="font-weight:700;">—</span>
          </div>

          <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px; font-size:13px;">
            <div>
              <span class="text-muted" style="font-size:11.5px; display:block;">Schedule &amp; Room</span>
              <strong id="start-modal-time-room" style="color:var(--text-primary);">—</strong>
            </div>
            <div>
              <span class="text-muted" style="font-size:11.5px; display:block;">Enrolled Students</span>
              <strong id="start-modal-students-count" style="color:var(--text-primary);">—</strong>
            </div>
          </div>
        </div>

        <div class="alert alert-info" style="margin:0; font-size:13px; line-height:1.5;">
          <i data-lucide="info" style="width:18px; height:18px; flex-shrink:0;"></i>
          <div>
            Starting this session will pre-mark all enrolled students as <strong>Absent</strong> and launch the <strong>Live Biometric Camera Scanner</strong>.
          </div>
        </div>
      </div>

      <div class="modal-footer" style="padding:14px 24px; background:var(--bg-secondary); border-top:1px solid var(--border); display:flex; justify-content:flex-end; gap:10px;">
        <button type="button" class="btn btn-outline" data-close-modal>Cancel</button>
        <button type="submit" class="btn btn-primary" data-loading-text="Launching Scanner...">
          <i data-lucide="camera"></i> Launch Live Scanner
        </button>
      </div>
    </form>
  </div>
</div>

<script>
function openStartSessionModal(url, sectionName, subjectName, timeRoom, studentCount) {
  const form = document.getElementById('start-session-form');
  if (form && url) form.action = url;

  const secEl = document.getElementById('start-modal-section-name');
  if (secEl) secEl.textContent = sectionName || 'Class Section';

  const subEl = document.getElementById('start-modal-subject-code');
  if (subEl) subEl.textContent = subjectName || '';

  const trEl = document.getElementById('start-modal-time-room');
  if (trEl) trEl.textContent = timeRoom || '—';

  const stEl = document.getElementById('start-modal-students-count');
  if (stEl) stEl.textContent = (studentCount || '0') + ' student(s)';

  if (typeof window.openModal === 'function') {
    window.openModal('start-session-modal');
  }
}

function closeStartSessionModal() {
  if (typeof window.closeModal === 'function') {
    window.closeModal('start-session-modal');
  }
}
</script>
