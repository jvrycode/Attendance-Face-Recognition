{# Inline attendance controls for one class schedule (teacher). Expects `sched`. #}
{% with ts=sched.today_session %}
  {% if ts %}
    {% if ts.status == 'open' %}
      <a href="{% url 'session_live' ts.pk %}" class="btn btn-primary btn-sm" title="Resume live face scanner" data-loading-text="Resuming...">
        <i data-lucide="camera"></i> Resume Scanner
      </a>
    {% else %}
      <span class="badge badge-muted" style="font-weight:600; margin-right:6px;" title="Attendance finished for today">
        <i data-lucide="check-circle" style="width:11px; height:11px;"></i> Finished
      </span>
      <form method="post" action="{% url 'session_reopen' ts.pk %}" style="display:inline; margin-right:4px;">
        {% csrf_token %}
        <button type="submit" class="btn btn-primary btn-sm" title="Re-open this session and launch camera scanning" data-loading-text="Launching...">
          <i data-lucide="camera"></i> Reopen &amp; Start Attendance
        </button>
      </form>
      <a href="{% url 'session_report' ts.pk %}" class="btn btn-outline btn-sm">
        <i data-lucide="file-text"></i> Report
      </a>
    {% endif %}
  {% else %}
    <a href="{% url 'session_start' sched.pk %}" class="btn btn-primary btn-sm" title="Start attendance for today" data-loading-text="Starting..."
       onclick="if(typeof window.openStartSessionModal==='function'){event.preventDefault(); window.openStartSessionModal('{% url 'session_start' sched.pk %}', '{{ sched.section.name|escapejs }}', '{{ sched.section.effective_subject.code|default:''|escapejs }} - {{ sched.section.effective_subject.name|default:'General'|escapejs }}', '{{ sched.time_display|escapejs }} @ {{ sched.room|escapejs }}', '{{ sched.section.enrollments.count }}');}">
      <i data-lucide="camera"></i> Start Attendance
    </a>
  {% endif %}
{% endwith %}
