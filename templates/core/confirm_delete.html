{% extends 'base.html' %}
{% block title %}Confirm Delete{% endblock %}
{% block page_title %}Confirm Delete{% endblock %}

{% block content %}
<div class="card" style="max-width:480px;">
  <div class="card-header"><span class="card-title">🗑️ Delete {{ type }}</span></div>
  <div class="card-body">
    <div class="alert alert-danger">
      ⚠️ Are you sure you want to delete <strong>{{ object }}</strong>?
      This action cannot be undone.
    </div>
    <form method="post">
      {% csrf_token %}
      <div class="flex gap-1">
        <button type="submit" class="btn btn-danger">🗑️ Yes, Delete</button>
        <a href="javascript:history.back()" class="btn btn-outline">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
